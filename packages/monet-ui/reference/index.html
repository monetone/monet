<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aperture · Liquid-Glass Panel System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<style>
  html, body { margin:0; padding:0; height:100%; background:#0b0e14; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }

  /* selection marquee for raster app */
  @keyframes ap-march { to { background-position: 8px 0; } }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<nav class="ap-xnav">
  <a class="ap-xnav-link" href="Design System.html">Design System</a>
  <a class="ap-xnav-link" href="Sandbox.html">Sandbox</a>
</nav>
<style>
  .ap-xnav {
    position: fixed; top: 14px; right: 16px; z-index: 9999;
    display: flex; gap: 4px; padding: 4px;
    border-radius: 999px;
    background: rgba(10,13,20,0.66);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.22), inset 0 0 0 0.5px rgba(255,255,255,0.10), 0 8px 24px rgba(0,0,0,0.4);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .ap-xnav-link {
    padding: 7px 15px; border-radius: 999px;
    font-size: 12.5px; font-weight: 500; letter-spacing: 0.01em;
    color: rgba(255,255,255,0.7); text-decoration: none;
    transition: background 0.12s, color 0.12s;
  }
  .ap-xnav-link:hover { background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.95); }
</style>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="panels.jsx"></script>
<script type="text/babel" src="dockable.jsx"></script>
<script type="text/babel" src="app-raster.jsx"></script>
<script type="text/babel" src="app-vector.jsx"></script>
<script type="text/babel" src="app-audio.jsx"></script>
<script type="text/babel" src="app-motion.jsx"></script>
<script type="text/babel" src="apps-anatomy.jsx"></script>
<script type="text/babel" src="app-layouts.jsx"></script>

<script type="text/babel" data-presets="env,react">
function App() {
  return (
    <DesignCanvas>

      <DCSection
        id="system"
        title="Aperture · liquid-glass panel system"
        subtitle="One reusable chrome — neutral glass + per-app accent tints. Each artboard is the same primitive set under a different app skin.">

        <DCArtboard id="anatomy" label="Anatomy · panel system" width={1100} height={700}>
          <AnatomyApp />
        </DCArtboard>

        <DCArtboard id="snap" label="Interaction · drag &amp; snap zones" width={1100} height={700}>
          <SnapDemoApp />
        </DCArtboard>

        <DCArtboard id="float" label="Interaction · floating panels" width={1100} height={700}>
          <FloatingDemoApp />
        </DCArtboard>

      </DCSection>

      <DCSection
        id="apps"
        title="Sample apps"
        subtitle="The same panel system dressed for four creative contexts, with in-window menus and document tabs.">

        <DCArtboard id="raster-win" label="01 · Raster — photo editing" width={1440} height={900}>
          <RasterApp platform="win" />
        </DCArtboard>

        <DCArtboard id="vector-win" label="02 · Vector — illustration" width={1440} height={900}>
          <VectorApp platform="win" />
        </DCArtboard>

        <DCArtboard id="audio-win" label="03 · Audio — multitrack" width={1440} height={900}>
          <AudioApp platform="win" />
        </DCArtboard>

        <DCArtboard id="motion-win" label="04 · Motion — video editing" width={1440} height={900}>
          <MotionApp platform="win" />
        </DCArtboard>

      </DCSection>

      <DCSection
        id="panel-org"
        title="Panel organization · one window, seven arrangements"
        subtitle="The exact same STUDIO app — identical panels, tools and canvas. Only the dock layout, toolbar placement and optional collapsed icon rails change. Drag any tab or toolbar grip in a window to keep re-organizing it.">

        <DCArtboard id="org-classic" label="01 · Classic — tools left · stacked right rail · icon rail" width={1440} height={900}>
          <LayoutWindow variant="classic" platform="win" />
        </DCArtboard>

        <DCArtboard id="org-mirrored" label="02 · Mirrored — tools right · panels docked left" width={1440} height={900}>
          <LayoutWindow variant="mirrored" platform="win" />
        </DCArtboard>

        <DCArtboard id="org-twin" label="03 · Twin docks — panels both sides · tools floating" width={1440} height={900}>
          <LayoutWindow variant="twin" platform="win" />
        </DCArtboard>

        <DCArtboard id="org-multicol" label="04 · Multi-column — two panel columns · icon rail" width={1440} height={900}>
          <LayoutWindow variant="multicol" platform="win" />
        </DCArtboard>

        <DCArtboard id="org-dual" label="05 · Dual rails — collapsed icon rails framing both edges" width={1440} height={900}>
          <LayoutWindow variant="dual" platform="win" />
        </DCArtboard>

        <DCArtboard id="org-workbench" label="06 · Bottom workbench — two stacked top toolbar rows · panel row below" width={1440} height={900}>
          <LayoutWindow variant="workbench" platform="win" />
        </DCArtboard>

        <DCArtboard id="org-floating" label="07 · Floating studio — every panel &amp; toolbar detached" width={1440} height={900}>
          <LayoutWindow variant="floating" platform="win" />
        </DCArtboard>

      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
