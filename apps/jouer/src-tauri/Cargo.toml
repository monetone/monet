[package]
name = "monet-jouer"
description = "Monet Jouer — a Phaser 2D game & animation editor on Monet UI"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# macOS uses this filename as the app name for `tauri dev` (there is no bundle).
[[bin]]
name = "Jouer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
monet-ui = { path = "../../../packages/monet-ui/crates/monet-ui" }
monet-mcp = { path = "../../../packages/monet-ui/crates/monet-mcp" }

[profile.release]
codegen-units = 1
# Thin (not fat) LTO: fat LTO miscompiles window-vibrancy's NSVisualEffectView
# Objective-C class registration ("symbol multiply defined" / bitcode load
# failure) on macOS. Thin LTO keeps the size/perf win without that collision.
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

# Standalone crate — detached from the shared monet-ui Cargo workspace.
[workspace]
