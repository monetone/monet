<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/><stop offset="0.2" stop-color="#ff9900"/>
      <stop offset="0.4" stop-color="#33cc33"/><stop offset="0.6" stop-color="#0099ff"/>
      <stop offset="0.8" stop-color="#6633ff"/><stop offset="1" stop-color="#ff33cc"/>
    </linearGradient>
    <linearGradient id="rot" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(55 0.5 0.5)">
      <stop offset="0" stop-color="#ff5e62"/><stop offset="1" stop-color="#1b1b66"/>
    </linearGradient>
    <radialGradient id="focal" cx="0.5" cy="0.5" r="0.5" fx="0.28" fy="0.3">
      <stop offset="0" stop-color="#fff8b0"/><stop offset="1" stop-color="#cc5500"/>
    </radialGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0.25" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#111111"/><stop offset="1" stop-color="#88aaee"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="360" height="48" fill="url(#rainbow)"/>
  <rect x="20" y="90" width="110" height="90" fill="url(#rot)"/>
  <circle cx="200" cy="135" r="48" fill="url(#focal)"/>
  <rect x="270" y="90" width="110" height="90" fill="url(#reflect)"/>
  <rect x="20" y="205" width="360" height="60" fill="none" stroke="url(#rainbow)" stroke-width="16"/>
</svg>
