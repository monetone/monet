<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- 3 levels deep: fill/stroke/stroke-width/opacity inherited + overridden, transforms compound -->
  <g fill="#e0573a" stroke="#222222" stroke-width="3" opacity="0.95">
    <rect x="20" y="20" width="70" height="50"/>
    <g transform="translate(120 0)" fill="#3ac06a">
      <rect x="20" y="20" width="70" height="50"/>
      <g transform="translate(120 0)" fill="#4a9eff" stroke-width="8">
        <rect x="20" y="20" width="70" height="50"/>
        <circle cx="55" cy="120" r="28"/>
      </g>
    </g>
    <circle cx="55" cy="120" r="28"/>
  </g>
  <g transform="translate(50 200) scale(1.2)" fill="#e0a13a" opacity="0.55">
    <rect x="0" y="0" width="60" height="40"/>
    <rect x="80" y="0" width="60" height="40"/>
    <rect x="160" y="0" width="60" height="40"/>
  </g>
</svg>
