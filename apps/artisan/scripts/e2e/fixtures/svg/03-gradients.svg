<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5e62"/>
      <stop offset="1" stop-color="#ff9966"/>
    </linearGradient>
    <radialGradient id="rg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#43e97b"/>
      <stop offset="1" stop-color="#38f9d7"/>
    </radialGradient>
    <!-- stops inherited via href, userSpaceOnUse coords -->
    <linearGradient id="base">
      <stop offset="0" stop-color="#4facfe"/>
      <stop offset="1" stop-color="#0033aa"/>
    </linearGradient>
    <linearGradient id="usos" xlink:href="#base" gradientUnits="userSpaceOnUse" x1="40" y1="185" x2="190" y2="285"/>
  </defs>
  <rect x="20" y="20" width="170" height="120" fill="url(#lg)"/>
  <circle cx="300" cy="80" r="58" fill="url(#rg)"/>
  <rect x="40" y="185" width="150" height="100" fill="url(#usos)"/>
  <text x="215" y="230" font-size="22" fill="#333333">gradients</text>
</svg>
