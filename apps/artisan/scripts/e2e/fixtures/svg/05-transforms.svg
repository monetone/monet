<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- translate, rotate, scale, matrix, and a nested-group transform -->
  <rect x="0" y="0" width="60" height="40" fill="#e0573a" transform="translate(30 45)"/>
  <rect x="0" y="0" width="60" height="40" fill="#3ac06a" transform="translate(180 70) rotate(25)"/>
  <rect x="0" y="0" width="60" height="40" fill="#4a9eff" transform="translate(300 60) scale(1.3 0.7)"/>
  <g transform="translate(50 175) rotate(12)">
    <rect x="0" y="0" width="90" height="55" fill="#e0a13a"/>
    <circle cx="45" cy="27" r="16" fill="#ffffff"/>
  </g>
  <rect x="0" y="0" width="70" height="45" fill="#a855f7" transform="matrix(1 0.35 -0.35 1 250 205)"/>
</svg>
