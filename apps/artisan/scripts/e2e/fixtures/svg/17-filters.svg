<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- <filter> feGaussianBlur + feDropShadow -->
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="40" y="70" width="120" height="100" fill="#4a9eff" filter="url(#blur)"/>
  <rect x="230" y="70" width="120" height="100" fill="#e0573a" filter="url(#ds)"/>
  <text x="40" y="250" font-size="20" fill="#333333">filters</text>
</svg>
