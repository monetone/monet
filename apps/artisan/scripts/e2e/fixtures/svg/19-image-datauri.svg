<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 300">
  <!-- embedded raster <image> via data: URI (href + legacy xlink:href), two sizes -->
  <image x="30" y="40" width="120" height="120" href="data:image/png;base64,"/>
  <image x="190" y="40" width="180" height="120" xlink:href="data:image/png;base64," preserveAspectRatio="none"/>
  <text x="30" y="210" font-size="20" fill="#333333">raster image import</text>
</svg>
