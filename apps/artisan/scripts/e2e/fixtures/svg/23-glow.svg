<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- glow: the exported 4-primitive group (SourceAlpha blur + flood + composite-in + merge) -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="gb"/>
      <feFlood flood-color="#ffd400" flood-opacity="0.9" result="gc"/>
      <feComposite in="gc" in2="gb" operator="in" result="gm"/>
      <feMerge><feMergeNode in="gm"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="140" r="70" fill="#222266" filter="url(#glow)"/>
  <text x="40" y="270" font-size="20" fill="#333333">glow</text>
</svg>
