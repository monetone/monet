<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 300">
  <!-- <use> referencing a <defs> group and a <symbol> (href + legacy xlink:href) -->
  <defs>
    <g id="star">
      <polygon points="0,-26 8,-8 27,-8 12,4 18,22 0,11 -18,22 -12,4 -27,-8 -8,-8"
               fill="#e0a13a" stroke="#a05a00" stroke-width="2"/>
    </g>
    <symbol id="badge" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="#4a9eff"/>
      <rect x="12" y="12" width="16" height="16" fill="#ffffff"/>
    </symbol>
  </defs>
  <use xlink:href="#star" x="80" y="80"/>
  <use xlink:href="#star" x="220" y="90" transform="scale(1.4)"/>
  <use href="#badge" x="40" y="190" width="60" height="60"/>
  <use href="#badge" x="170" y="190" width="80" height="80"/>
</svg>
