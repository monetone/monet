[package]
name = "monet_anime"
description = "Monet Anime — a liquid-glass motion graphics & compositing studio (After Effects-class)."
version = "0.1.0"
edition = "2021"
license = "MIT"

# macOS uses this filename as the app name for `tauri dev` (there is no bundle).
[[bin]]
name = "Anime"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for Monet's transparent + native-vibrancy
# window on macOS.
tauri = { version = "2", features = ["macos-private-api"] }

# The Monet Tauri integration crate, consumed from the shared monet-ui package
# in this monorepo (packages/monet-ui/crates/monet-ui).
monet-ui = { path = "../../../packages/monet-ui/crates/monet-ui" }
monet-mcp = { path = "../../../packages/monet-ui/crates/monet-mcp" }

# Native OS file/save/message dialogs. Registered via `monet_ui::dialog_plugin()`
# in main.rs and matched by the `@tauri-apps/plugin-dialog` JS package.
tauri-plugin-dialog = "2"

# Read/write project files to disk for save/open.
tauri-plugin-fs = "2"

# A slimmer release profile for the bundled app.
[profile.release]
codegen-units = 1
# Thin (not fat) LTO: fat LTO miscompiles window-vibrancy's NSVisualEffectView
# Objective-C class registration ("symbol multiply defined" / bitcode load
# failure) on macOS — tauri pulls window-vibrancy 0.6 while monet-ui pulls 0.7.
# Thin LTO keeps the size/perf win without that collision.
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
