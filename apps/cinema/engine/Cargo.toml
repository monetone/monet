[package]
name = "cinema-engine"
description = "Monet Cinema — Rust/WASM compositing engine: per-frame layer compositing, transforms, blend modes, Lumetri color, transitions and video scopes."
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Detach from any parent Cargo workspace: the engine builds standalone via wasm-pack.
[workspace]
